name: build

# Build only for version tags (e.g. v1.0.0) and pull requests.
# Pushing to main does NOT compile — releases are built from tags.

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  macos:
    name: macOS (app + engine tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (debug)
        run: swift build

      - name: Engine tests (headless)
        run: swift test

      - name: Build release app bundle
        run: swift build -c release --product MorseRunner

      - name: Build release TUI
        run: swift build -c release --product MorseRunnerTUI

      - name: Package .app
        run: ./make-app.sh

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorseRunner-macOS
          path: dist/MorseRunner.app
          if-no-files-found: error

  linux:
    name: Linux (engine + terminal UI)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Build (debug)
        run: swift build

      - name: Engine tests (headless)
        run: swift test

      - name: Terminal UI sanity check
        run: .build/debug/MorseRunnerTUI --help

      - name: Terminal UI short WAV run
        run: |
          printf 'r\ncq\nq\n' | timeout 15 .build/debug/MorseRunnerTUI --contest 0 --duration 30 --wav /tmp/out.wav || true
          test -s /tmp/out.wav && file /tmp/out.wav
