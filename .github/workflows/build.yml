name: build

# Build only for version tags (e.g. v1.0.0) and pull requests.
# Pushing to main does NOT compile — releases are built from tags.

on:
  push:
    tags: ['v*']
  pull_request:

jobs:
  macos:
    name: macOS (app + engine tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (debug)
        run: swift build

      - name: Engine tests (headless)
        run: swift test

      - name: Build release app bundle
        run: swift build -c release --product MorseRunner

      - name: Build release TUI
        run: swift build -c release --product MorseRunnerTUI

      - name: Package .app
        run: ./make-app.sh

      - name: Zip .app for release
        run: ditto -c -k --sequesterRsrc --keepParent dist/MorseRunner.app MorseRunner-macOS.zip

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorseRunner-macOS
          path: dist/MorseRunner.app
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: MorseRunner-macOS.zip
          generate_release_notes: true

  linux:
    name: Linux (engine + terminal UI)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      # Build only the cross-platform products; the macOS AppKit target
      # cannot compile on Linux, and `swift test` builds the whole package,
      # so engine XCTests run on the macOS job only.
      - name: Build TUI (debug)
        run: swift build --product MorseRunnerTUI

      - name: Terminal UI sanity check
        run: .build/debug/MorseRunnerTUI --help

      - name: Terminal UI short WAV run
        run: |
          (sleep 1; echo r; sleep 3; echo cq; sleep 5; echo q) \
            | .build/debug/MorseRunnerTUI --contest 0 --duration 30 --wav /tmp/out.wav || true
          test -s /tmp/out.wav
